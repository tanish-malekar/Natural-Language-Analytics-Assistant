[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "natural-language-analytics-assistant"
version = "0.1.0"
description = "LangGraph text-to-SQL with supervised Qwen2.5-Coder adaptation"
requires-python = ">=3.11,<3.14"
dependencies = ["langgraph==1.0.7", "snowflake-connector-python==4.2.0", "sqlglot==28.7.0", "plotly==6.5.2", "pydantic==2.12.5", "python-dotenv==1.2.1", "torch==2.10.0", "transformers==4.57.6", "accelerate==1.12.0", "peft==0.18.1", "pandas==2.3.3"]
[project.optional-dependencies]
train = ["trl==0.27.1", "datasets==4.5.0", "bitsandbytes==0.49.1"]
dev = ["pytest==9.0.2"]
[project.scripts]
nl-analytics = "analytics_assistant.cli:main"
[tool.setuptools.packages.find]
include = ["analytics_assistant*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
